name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build must be reproducible
        run: git diff --exit-code -- dist/app.js
